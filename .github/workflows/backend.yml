name: backend

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 읽기 권한만 (검사 도구가 레포 변경 X)
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Back
    steps:
      # 외부 Action은 커밋 해시 고정 (태그 바꿔치기 방지)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/base.txt -r requirements/dev.txt

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py test

      - name: Bandit
        run: bandit -q -r . -x ./requirements

      - name: pip-audit
        run: pip-audit -r requirements/base.txt -r requirements/prod.txt
