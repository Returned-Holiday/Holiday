# /etc/nginx/conf.d/returnedholiday.conf (http 컨텍스트)
# <도메인>은 서버에서 치환, 레포에는 실제 값 X

# 버전 노출 X (WEB-16)
server_tokens off;

# 쿼리스트링 제외 ($request X → 검색어·개인정보 로그 X)
log_format rh_noquery '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';

# 관리자 허용 IP (목록은 서버 별도 파일, 레포 X)
geo $rh_admin_allowed {
    default 0;
    include /etc/nginx/returnedholiday/admin-allow.geo;
}

# IP당 요청 제한 (DRF 제한 앞단, 폭주 요청이 앱·로그까지 오지 않게)
limit_req_zone $binary_remote_addr zone=rh_api:10m rate=10r/s;
# 로그인·가입·비밀번호·탈퇴·OTP (대입 공격)
limit_req_zone $binary_remote_addr zone=rh_auth:10m rate=1r/s;

upstream returnedholiday_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# 모르는 Host → 연결 종료 (Host 헤더 조작 X)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name <도메인>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host X → 고정 도메인으로만 (WEB-21)
    location / {
        return 301 https://<도메인>$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <도메인>;

    ssl_certificate /etc/letsencrypt/live/<도메인>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<도메인>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    access_log /var/log/nginx/returnedholiday.access.log rh_noquery;
    error_log /var/log/nginx/returnedholiday.error.log warn;

    autoindex off;
    ssi off;
    disable_symlinks on;
    # Django 업로드 상한과 같음 (WEB-08)
    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 필요 메소드만 (WebDAV·TRACE 등 X, WEB-18)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
        return 405;
    }

    # always → 에러 응답에도. location에 add_header 두면 상속 끊김 → 여기에만
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 공통 에러 페이지, 직접 접근 X (WEB-22)
    error_page 400 403 404 405 413 500 502 503 504 /_error.html;
    location = /_error.html {
        internal;
        root /srv/returnedholiday/nginx;
    }

    # 제한 초과 → 앱 429와 같은 바이트 (nginx 기본 화면·서버 종류 노출 X)
    limit_req_status 429;
    # warn이면 에러 로그에 쿼리스트링 포함 요청 줄 → info (429는 접근 로그에 쿼리 없이)
    limit_req_log_level info;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
    }

    location /api/admin/ {
        # 허용 IP 외 → Django 404와 같은 바이트 (관리자 API 존재 숨김, DRF 압축 형식)
        default_type application/json;
        if ($rh_admin_allowed = 0) {
            return 404 '{"code":"NOT_FOUND","message":"요청한 정보를 찾을 수 없습니다."}';
        }
        limit_req zone=rh_api burst=20 nodelay;
        include /etc/nginx/returnedholiday/proxy-params.conf;
    }

    # OCR: 5MB 업로드 + CLOVA 과금 → 본문 받기 전에 nginx에서 제한
    location = /api/guides/ocr/ {
        limit_req zone=rh_auth burst=5 nodelay;
        limit_req zone=rh_api burst=20 nodelay;
        include /etc/nginx/returnedholiday/proxy-params.conf;
    }

    location ~ ^/api/auth/(login|signup|password|withdraw|otp)/$ {
        limit_req zone=rh_auth burst=5 nodelay;
        limit_req zone=rh_api burst=20 nodelay;
        include /etc/nginx/returnedholiday/proxy-params.conf;
    }

    location /api/ {
        limit_req zone=rh_api burst=20 nodelay;
        include /etc/nginx/returnedholiday/proxy-params.conf;
    }

    root /srv/returnedholiday/front/dist;
    index index.html;

    # 숨김 파일 X (.git·.env 등)
    location ~ /\. {
        return 404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA 경로 → index.html
    location / {
        try_files $uri /index.html;
    }
}
